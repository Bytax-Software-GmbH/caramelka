# Nur lokal: fängt alle Mails ab, statt sie zu verschicken.
# Start: docker compose -f docker-compose.dev.yml up -d  → UI http://localhost:8025
# .env: SMTP_HOST=localhost, SMTP_PORT=1025
services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    restart: unless-stopped
